AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enforces an IAM account password policy meeting FedRAMP Moderate/High
  expectations. Note: this only governs IAM users with console passwords —
  it does not apply to SSO/Identity Center users, whose password/MFA policy
  is governed by the connected identity provider.

  Control mapping:
    Rev5 (Moderate/High): IA-5(1), AC-2, AC-7
    FedRAMP 20x: KSI-IAM-01 (strong authentication), KSI-IAM-02 (credential lifecycle)

Parameters:
  MinimumPasswordLength:
    Type: Number
    Default: 14
    MinValue: 14
    Description: Rev5 Moderate/High both expect a 14-character minimum.

  MaxPasswordAge:
    Type: Number
    Default: 60
    Description: Days before a password must be rotated.

  PasswordReusePrevention:
    Type: Number
    Default: 24
    Description: Number of previous passwords remembered to prevent reuse.

Resources:
  AccountPasswordPolicy:
    Type: AWS::IAM::AccountPasswordPolicy
    Properties:
      MinimumPasswordLength: !Ref MinimumPasswordLength
      RequireUppercaseCharacters: true
      RequireLowercaseCharacters: true
      RequireNumbers: true
      RequireSymbols: true
      AllowUsersToChangePassword: true
      MaxPasswordAge: !Ref MaxPasswordAge
      PasswordReusePrevention: !Ref PasswordReusePrevention
      HardExpiry: false
