AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hardened ECR Repository with KMS Encryption and Tag Immutability'

Parameters:
  RepositoryName:
    Type: String
    Description: 'Name of the ECR Repository'

Resources:
  # Note: unlike CloudWatch Logs, ECR image push/pull operations authorize
  # through the calling IAM principal (the developer, CI/CD role, or task
  # execution role doing docker push/pull) rather than through a fixed
  # service-principal grant on the key. Whoever needs to push or pull
  # images from this repository must have kms:GenerateDataKey/kms:Decrypt
  # on this key — via an IAM identity policy on their own role, or an
  # additional statement here — which this template doesn't grant on its
  # own since it doesn't know which principals need access.
  ECRKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'Dedicated KMS CMK for ECR repository encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt ECRKmsKey.Arn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images older than 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  RepositoryArn:
    Value: !GetAtt ECRRepository.Arn
