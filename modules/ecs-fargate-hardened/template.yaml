AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hardened ECS Fargate Cluster with Container Insights and KMS Logging'

Parameters:
  ClusterName:
    Type: String
    Description: 'Name of the ECS Cluster'

  LogRetentionDays:
    Type: Number
    Default: 365
    Description: 'Log retention in days'

Resources:
  ECSKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS Key for ECS CloudWatch and Exec logging'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # Required: CloudWatch Logs makes its own encrypt/decrypt calls
          # as the logs service. Without this statement, log delivery to
          # a KMS-encrypted log group fails outright.
          - Sid: AllowCloudWatchLogsEncrypt
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          # Note: this key is also referenced by ECS Exec for encrypting
          # the interactive session data channel, which separately
          # requires kms:GenerateDataKey/kms:Decrypt for whichever IAM
          # principals actually run `aws ecs execute-command` — grant
          # that from your root configuration, since a reusable template
          # can't know who those principals are.

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ecs/${ClusterName}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt ECSKmsKey.Arn

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: OVERRIDE
          KmsKeyId: !GetAtt ECSKmsKey.Arn
          LogConfiguration:
            CloudWatchLogGroupName: !Ref ECSLogGroup

Outputs:
  ClusterArn:
    Value: !GetAtt ECSCluster.Arn
