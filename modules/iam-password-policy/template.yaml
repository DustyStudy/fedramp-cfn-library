AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enforces an IAM account password policy meeting FedRAMP Moderate/High
  expectations. Note: this only governs IAM users with console passwords —
  it does not apply to SSO/Identity Center users, whose password/MFA policy
  is governed by the connected identity provider.

  IMPLEMENTATION NOTE: CloudFormation has no native resource type for the
  account password policy (there is no AWS::IAM::AccountPasswordPolicy) —
  it can only be set via the IAM API's UpdateAccountPasswordPolicy action.
  This template uses a small Lambda-backed custom resource to make that API
  call, which is the standard pattern for this gap.

  Control mapping:
    Rev5 (Moderate/High): IA-5(1), AC-2, AC-7
    FedRAMP 20x: KSI-IAM-01 (strong authentication), KSI-IAM-02 (credential lifecycle)

Parameters:
  MinimumPasswordLength:
    Type: Number
    Default: 14
    MinValue: 14
    Description: Rev5 Moderate/High both expect a 14-character minimum.

  MaxPasswordAge:
    Type: Number
    Default: 60
    Description: Days before a password must be rotated.

  PasswordReusePrevention:
    Type: Number
    Default: 24
    Description: Number of previous passwords remembered to prevent reuse.

Resources:
  PasswordPolicyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: account-password-policy-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  PasswordPolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: SetAccountPasswordPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccountPasswordPolicy
                  - iam:GetAccountPasswordPolicy
                # This is an account-level (not resource-level) IAM API —
                # it has no ARN to scope to, so a wildcard resource is
                # required here.
                Resource: '*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PasswordPolicyDLQ.Arn

  PasswordPolicyFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_117"
            comment: >-
              This function only calls AWS control-plane APIs (IAM,
              CloudFormation's callback URL) — no VPC-resident resources are
              touched. Placing it in a VPC would require a NAT gateway or
              VPC endpoints purely to reach public AWS API endpoints, adding
              cost and failure modes with no security benefit.
    Properties:
      FunctionName: account-password-policy-custom-resource
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      ReservedConcurrentExecutions: 1
      DeadLetterConfig:
        TargetArn: !GetAtt PasswordPolicyDLQ.Arn
      Role: !GetAtt PasswordPolicyLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request


          def send_response(event, context, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': 'account-password-policy',
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', str(len(body)))
              urllib.request.urlopen(req)


          def handler(event, context):
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      props = event['ResourceProperties']
                      client = boto3.client('iam')
                      client.update_account_password_policy(
                          MinimumPasswordLength=int(props['MinimumPasswordLength']),
                          RequireSymbols=True,
                          RequireNumbers=True,
                          RequireUppercaseCharacters=True,
                          RequireLowercaseCharacters=True,
                          AllowUsersToChangePassword=True,
                          MaxPasswordAge=int(props['MaxPasswordAge']),
                          PasswordReusePrevention=int(props['PasswordReusePrevention']),
                          HardExpiry=False
                      )
                  # On stack deletion, intentionally leave the password
                  # policy in place rather than reverting it — silently
                  # weakening account-wide password requirements just
                  # because someone deleted this stack is the wrong
                  # default for a security baseline.
                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  send_response(event, context, 'FAILED', reason=str(e))

  AccountPasswordPolicy:
    Type: Custom::AccountPasswordPolicy
    Properties:
      ServiceToken: !GetAtt PasswordPolicyFunction.Arn
      MinimumPasswordLength: !Ref MinimumPasswordLength
      MaxPasswordAge: !Ref MaxPasswordAge
      PasswordReusePrevention: !Ref PasswordReusePrevention

Outputs:
  PasswordPolicyFunctionArn:
    Description: ARN of the custom resource Lambda that sets the account password policy
    Value: !GetAtt PasswordPolicyFunction.Arn
