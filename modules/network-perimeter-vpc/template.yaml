AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hardened 3-Tier Network Perimeter VPC with KMS Encrypted Flow Logs'

Parameters:
  Environment:
    Type: String
    Default: 'fedramp'

  VpcCidr:
    Type: String
    Default: '10.100.0.0/16'

  LogRetentionDays:
    Type: Number
    Default: 365

Resources:
  FlowLogsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS Key for VPC Flow Logs Log Group'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # Required: CloudWatch Logs makes its own encrypt/decrypt calls
          # as the logs service (separate from whichever IAM role
          # publishes flow log records via logs:PutLogEvents). Without
          # this statement, the log group can't be encrypted with this
          # CMK at all.
          - Sid: AllowCloudWatchLogsEncrypt
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

  FlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpc-flow-logs/${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt FlowLogsKmsKey.Arn

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogsDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub '${FlowLogsGroup.Arn}:*'

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-perimeter-vpc'

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      MaxAggregationInterval: 60
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogDestination: !GetAtt FlowLogsGroup.Arn

  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.100.10.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-app-tier-1'

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.100.20.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-app-tier-2'

  DatabaseSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.100.100.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-db-tier-1'

  DatabaseSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.100.200.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-db-tier-2'

Outputs:
  VpcId:
    Value: !Ref VPC
  AppSubnet1Id:
    Value: !Ref AppSubnet1
  AppSubnet2Id:
    Value: !Ref AppSubnet2
  DatabaseSubnet1Id:
    Value: !Ref DatabaseSubnet1
  DatabaseSubnet2Id:
    Value: !Ref DatabaseSubnet2
