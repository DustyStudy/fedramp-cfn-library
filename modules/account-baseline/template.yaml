AWSTemplateFormatVersion: '2010-09-09'
Description: 'FedRAMP Shared Account Baseline Module (Custom Resource Implementation)'

Parameters:
  MinimumPasswordLength:
    Type: Number
    Default: 14
    Description: 'Minimum password length (FedRAMP Moderate >= 14, High >= 16).'

  MaxPasswordAge:
    Type: Number
    Default: 60
    Description: 'Maximum password age in days (FedRAMP <= 60 or 90 days).'

  PasswordReusePrevention:
    Type: Number
    Default: 24
    Description: 'Number of previous passwords to block reuse (FedRAMP >= 24).'

  EBSKmsKeyArn:
    Type: String
    Default: ''
    Description: 'Optional custom KMS Key ARN for EBS default encryption.'

Conditions:
  HasCustomKmsKey: !Not [!Equals [!Ref EBSKmsKeyArn, '']]

Resources:
  BaselineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FedRAMPAccountBaselinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*-account-baseline:*'
              - Effect: Allow
                Action:
                  - s3:PutAccountPublicAccessBlock
                  - s3:GetAccountPublicAccessBlock
                  - ec2:EnableEbsEncryptionByDefault
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:ModifyEbsDefaultKmsKeyId
                  - ec2:GetEbsDefaultKmsKeyId
                  - iam:UpdateAccountPasswordPolicy
                  - iam:GetAccountPasswordPolicy
                Resource: '*'

  BaselineFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: 'Custom Resource Lambda executes synchronously during CloudFormation provisioning and does not require an asynchronous DLQ'
          - id: CKV_AWS_117
            comment: 'Custom Resource Lambda requires direct access to AWS service APIs and does not run inside a VPC'
    Properties:
      FunctionName: !Sub '${AWS::StackName}-account-baseline'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt BaselineExecutionRole.Arn
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              if event['RequestType'] in ['Create', 'Update']:
                  try:
                      s3control = boto3.client('s3control')
                      ec2 = boto3.client('ec2')
                      iam = boto3.client('iam')
                      account_id = context.invoked_function_arn.split(':')[4]
                      
                      s3control.put_public_access_block(
                          AccountId=account_id,
                          PublicAccessBlockConfiguration={
                              'BlockPublicAcls': True,
                              'IgnorePublicAcls': True,
                              'BlockPublicPolicy': True,
                              'RestrictPublicBuckets': True
                          }
                      )
                      
                      ec2.enable_ebs_encryption_by_default()
                      kms_key_arn = event['ResourceProperties'].get('EBSKmsKeyArn')
                      if kms_key_arn:
                          ec2.modify_ebs_default_kms_key_id(KmsKeyId=kms_key_arn)
                          
                      props = event['ResourceProperties']
                      iam.update_account_password_policy(
                          MinimumPasswordLength=int(props.get('MinimumPasswordLength', 14)),
                          RequireSymbols=True,
                          RequireNumbers=True,
                          RequireUppercaseCharacters=True,
                          RequireLowercaseCharacters=True,
                          AllowUsersToChangePassword=True,
                          MaxPasswordAge=int(props.get('MaxPasswordAge', 60)),
                          PasswordReusePrevention=int(props.get('PasswordReusePrevention', 24)),
                          HardExpiry=False
                      )
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {"Status": "COMPLIANT"})
                  except Exception as e:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  AccountBaselineEnforcer:
    Type: Custom::AccountBaseline
    Properties:
      ServiceToken: !GetAtt BaselineFunction.Arn
      MinimumPasswordLength: !Ref MinimumPasswordLength
      MaxPasswordAge: !Ref MaxPasswordAge
      PasswordReusePrevention: !Ref PasswordReusePrevention
      EBSKmsKeyArn: !If [HasCustomKmsKey, !Ref EBSKmsKeyArn, !Ref 'AWS::NoValue']

Outputs:
  BaselineStatus:
    Description: 'Account Baseline Compliance Status'
    Value: !GetAtt AccountBaselineEnforcer.Status
