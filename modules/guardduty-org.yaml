AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enables Amazon GuardDuty with organization auto-enrollment for new
  accounts. Deploy from the GuardDuty delegated administrator account.

  IMPLEMENTATION NOTE: CloudFormation has no native resource type for
  GuardDuty organization auto-enrollment (there is no
  AWS::GuardDuty::OrganizationConfiguration) — it can only be set via the
  GuardDuty API's UpdateOrganizationConfiguration action. This template uses
  a small Lambda-backed custom resource to make that call. The underlying
  API itself changed in recent years: the boolean AutoEnable parameter is
  deprecated in favor of AutoEnableOrganizationMembers (NEW|ALL|NONE), which
  is what this template uses.

  Control mapping:
    Rev5 (Moderate/High): SI-4, IR-4, RA-5
    FedRAMP 20x: KSI-MLA-03 (threat detection), KSI-INR-01 (incident detection capability)

Parameters:
  FindingPublishingFrequency:
    Type: String
    Default: FIFTEEN_MINUTES
    AllowedValues: [FIFTEEN_MINUTES, ONE_HOUR, SIX_HOURS]
    Description: How often GuardDuty publishes findings to CloudWatch Events.

  AutoEnableOrganizationMembers:
    Type: String
    Default: NEW
    AllowedValues: [NEW, ALL, NONE]
    Description: >
      NEW enables GuardDuty automatically only for accounts that join the
      organization going forward. ALL also retroactively enables it for
      every existing member account (can take up to 24 hours to propagate).
      NONE disables auto-enrollment entirely.

Resources:
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: !Ref FindingPublishingFrequency
      DataSources:
        S3Logs:
          Enable: true
        Kubernetes:
          AuditLogs:
            Enable: true
        MalwareProtection:
          ScanEc2InstanceWithFindings:
            EbsVolumes: true

  GuardDutyOrgConfigLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UpdateGuardDutyOrgConfiguration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - guardduty:UpdateOrganizationConfiguration
                  - guardduty:DescribeOrganizationConfiguration
                # GuardDuty organization configuration is scoped by
                # DetectorId in the request body, not by IAM resource ARN —
                # these actions don't support resource-level permissions.
                Resource: '*'

  GuardDutyOrgConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: guardduty-org-config-custom-resource
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt GuardDutyOrgConfigLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request


          def send_response(event, context, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': 'guardduty-org-config',
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', str(len(body)))
              urllib.request.urlopen(req)


          def handler(event, context):
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      props = event['ResourceProperties']
                      client = boto3.client('guardduty')
                      client.update_organization_configuration(
                          DetectorId=props['DetectorId'],
                          AutoEnableOrganizationMembers=props['AutoEnableOrganizationMembers']
                      )
                  # On stack deletion, intentionally leave the org
                  # configuration in place rather than reverting it —
                  # silently stopping auto-enrollment for new member
                  # accounts just because someone deleted this stack is
                  # the wrong default for a security baseline.
                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  send_response(event, context, 'FAILED', reason=str(e))

  GuardDutyOrgConfiguration:
    Type: Custom::GuardDutyOrganizationConfiguration
    Properties:
      ServiceToken: !GetAtt GuardDutyOrgConfigFunction.Arn
      DetectorId: !Ref GuardDutyDetector
      AutoEnableOrganizationMembers: !Ref AutoEnableOrganizationMembers

  GuardDutyFindingsEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: guardduty-findings-to-sns
      Description: Route GuardDuty findings of Medium severity or higher for alerting/incident response.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          severity:
            - numeric: ['>=', 4]
      State: ENABLED
      Targets:
        - Arn: !Ref GuardDutyFindingsTopic
          Id: GuardDutyFindingsTarget

  GuardDutyFindingsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: guardduty-findings-medium-plus
      KmsMasterKeyId: alias/aws/sns

  GuardDutyFindingsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref GuardDutyFindingsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref GuardDutyFindingsTopic

Outputs:
  DetectorId:
    Description: GuardDuty detector ID
    Value: !Ref GuardDutyDetector
  FindingsTopicArn:
    Description: >
      SNS topic receiving Medium+ severity findings — subscribe your
      incident response team or SOAR pipeline (see incident-response/ for IR
      automation templates).
    Value: !Ref GuardDutyFindingsTopic
