AWSTemplateFormatVersion: '2010-09-09'
Description: 'FedRAMP Shared Organization Governance & Policies Module'

Parameters:
  TargetId:
    Type: String
    Default: ''
    Description: 'Optional OU or Account ID to attach the policies'

  BackupRetentionDays:
    Type: Number
    Default: 365
    Description: 'Backup retention in days (Moderate: 365, High: 1095)'

  BackupRegions:
    Type: CommaDelimitedList
    Default: 'us-east-1,us-west-2'
    Description: >-
      Regions the centralized backup plan replicates to. Defaults assume a
      standard AWS commercial deployment — if deploying in AWS GovCloud,
      override with GovCloud region names (e.g. us-gov-west-1,
      us-gov-east-1) instead, since the two partitions don't share regions.

Conditions:
  HasTargetId: !Not [!Equals [!Ref TargetId, '']]

Resources:
  # 1. Workload Perimeter SCP
  WorkloadPerimeterSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-workload-perimeter-scp'
      Description: 'FedRAMP Workload Perimeter (Root Deny, Direct IGW Block, SSO Enforcement)'
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRootUserActions
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              StringLike:
                'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::*:root'

          - Sid: DenyDirectInternetGateways
            Effect: Deny
            Action:
              - 'ec2:CreateInternetGateway'
              - 'ec2:AttachInternetGateway'
              - 'ec2:CreateEgressOnlyInternetGateway'
            Resource: '*'

          - Sid: DenyLocalIAMUsersAndAccessKeys
            Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
            Resource: '*'

  # 2. AI Services Opt-Out Policy
  AIOptOutPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-ai-opt-out-policy'
      Description: 'Opt out of AWS AI/ML services using customer data for training'
      Type: AISERVICES_OPT_OUT_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content:
        services:
          default:
            opt_out_policy:
              '@@operators_allowed_for_child_policies':
                - '@@none'
              '@@assign': 'optOut'

  # 3. Centralized Backup Policy
  BackupCompliancePolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-centralized-backup-policy'
      Description: 'Automated centralized backup policy with retention'
      Type: BACKUP_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content: !Sub
        - |
          {
            "plans": {
              "FedRAMPDailyBackupPlan": {
                "regions": { "@@assign": ["${RegionsJoined}"] },
                "rules": {
                  "DailyRule": {
                    "schedule_expression": { "@@assign": "cron(0 5 ? * * *)" },
                    "start_backup_window_minutes": { "@@assign": 60 },
                    "complete_backup_window_minutes": { "@@assign": 120 },
                    "lifecycle": {
                      "move_to_cold_storage_after_days": { "@@assign": 30 },
                      "delete_after_days": { "@@assign": ${BackupRetentionDays} }
                    },
                    "target_backup_vault_name": { "@@assign": "FedRAMPComplianceVault" }
                  }
                },
                "selections": {
                  "tags": {
                    "FedRAMPBackup": {
                      "iam_role_arn": { "@@assign": "arn:${AWS::Partition}:iam::$account:role/AWSBackupDefaultServiceRole" },
                      "tag_key": { "@@assign": "Backup" },
                      "tag_value": { "@@assign": ["true", "True"] }
                    }
                  }
                }
              }
            }
          }
        - RegionsJoined: !Join ['", "', !Ref BackupRegions]

Outputs:
  WorkloadPerimeterSCPId:
    Description: 'ID of the Workload Perimeter SCP'
    Value: !Ref WorkloadPerimeterSCP

  AIOptOutPolicyId:
    Description: 'ID of the AI Opt-Out Policy'
    Value: !Ref AIOptOutPolicy

  BackupCompliancePolicyId:
    Description: 'ID of the Centralized Backup Policy'
    Value: !Ref BackupCompliancePolicy
