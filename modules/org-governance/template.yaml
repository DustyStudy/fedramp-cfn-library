AWSTemplateFormatVersion: '2010-09-09'
Description: 'FedRAMP Shared Organization Governance & Policies Module'

Parameters:
  TargetId:
    Type: String
    Default: ''
    Description: 'Optional OU or Account ID to attach the policies'

  BackupRetentionDays:
    Type: Number
    Default: 365
    Description: 'Backup retention in days (Moderate: 365, High: 1095)'

Conditions:
  HasTargetId: !Not [!Equals [!Ref TargetId, '']]

Resources:
  # 1. Workload Perimeter SCP
  WorkloadPerimeterSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-workload-perimeter-scp'
      Description: 'FedRAMP Workload Perimeter (Root Deny, Direct IGW Block, SSO Enforcement)'
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRootUserActions
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              StringLike:
                'aws:PrincipalArn': 'arn:aws:iam::*:root'

          - Sid: DenyDirectInternetGateways
            Effect: Deny
            Action:
              - 'ec2:CreateInternetGateway'
              - 'ec2:AttachInternetGateway'
              - 'ec2:CreateEgressOnlyInternetGateway'
            Resource: '*'

          - Sid: DenyLocalIAMUsersAndAccessKeys
            Effect: Deny
            Action:
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
            Resource: '*'

  # 2. AI Services Opt-Out Policy
  AIOptOutPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-ai-opt-out-policy'
      Description: 'Opt out of AWS AI/ML services using customer data for training'
      Type: AISERVICES_OPT_OUT_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content:
        services:
          default:
            opt_out_policy:
              '@@operators_allowed_for_child_policies':
                - '@@none'
              '@@assign': 'optOut'

Outputs:
  WorkloadPerimeterSCPId:
    Description: 'ID of the Workload Perimeter SCP'
    Value: !Ref WorkloadPerimeterSCP

  AIOptOutPolicyId:
    Description: 'ID of the AI Opt-Out Policy'
    Value: !Ref AIOptOutPolicy
