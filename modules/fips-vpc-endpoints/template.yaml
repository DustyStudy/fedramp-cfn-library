AWSTemplateFormatVersion: '2010-09-09'
Description: 'FIPS 140-2/3 Compliant VPC Endpoints and PrivateLink Infrastructure'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'Target VPC ID'

  VpcCidr:
    Type: String
    Description: 'VPC CIDR block allowed to communicate with endpoints'

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Private subnets where Interface Endpoints reside'

  RouteTableIds:
    Type: List<String>
    Description: 'Route Table IDs for S3 Gateway Endpoint'

Resources:
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for FIPS-validated VPC interface endpoints'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: 'Inbound TLS from VPC CIDR'
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr

  # KMS FIPS Endpoint — kms-fips is a genuine, distinct VPC endpoint
  # service name (confirmed against AWS's PrivateLink service list).
  KmsFipsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms-fips'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !GetAtt EndpointSecurityGroup.GroupId

  # Secrets Manager Endpoint — NOTE: Secrets Manager has no distinct
  # '-fips' suffixed VPC endpoint service name as of this writing (unlike
  # KMS/EC2/STS). Where AWS offers FIPS access to Secrets Manager, it's
  # via an alternate FIPS-labeled private DNS hostname on this SAME
  # endpoint, which is a client/application-level configuration choice,
  # not a separate resource this template can create. Verify current
  # availability against https://docs.aws.amazon.com/vpc/latest/privatelink/aws-services-privatelink-support.html
  # before assuming this endpoint alone satisfies a FIPS requirement.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !GetAtt EndpointSecurityGroup.GroupId

  # CloudWatch Logs Endpoint — same caveat as Secrets Manager above: no
  # distinct '-fips' suffixed service name exists for 'logs'.
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !GetAtt EndpointSecurityGroup.GroupId

  # STS FIPS Endpoint — sts-fips is a genuine, distinct VPC endpoint
  # service name (confirmed against AWS's PrivateLink service list).
  StsFipsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts-fips'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !GetAtt EndpointSecurityGroup.GroupId

  # S3 Gateway Endpoint
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

Outputs:
  EndpointSecurityGroupId:
    Value: !GetAtt EndpointSecurityGroup.GroupId
  KmsFipsEndpointId:
    Value: !Ref KmsFipsEndpoint
  SecretsManagerEndpointId:
    Value: !Ref SecretsManagerEndpoint
  StsFipsEndpointId:
    Value: !Ref StsFipsEndpoint
