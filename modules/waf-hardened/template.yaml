AWSTemplateFormatVersion: '2010-09-09'
Description: 'FedRAMP SC-5 / SI-3 Compliant Regional Web ACL with OWASP Core Rules'

Parameters:
  Environment:
    Type: String
    Default: 'fedramp'

  Scope:
    Type: String
    Default: 'REGIONAL'

Resources:
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${Environment}-fedramp-waf-acl'
      Scope: !Ref Scope
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${Environment}-waf-metrics'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
            SampledRequestsEnabled: true

        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsMetric
            SampledRequestsEnabled: true

        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: IpReputationMetric
            SampledRequestsEnabled: true

        - Name: RateLimitPerIp
          Priority: 40
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
            SampledRequestsEnabled: true

Outputs:
  WebACLArn:
    Value: !GetAtt WebACL.Arn
  WebACLId:
    Value: !GetAtt WebACL.Id
