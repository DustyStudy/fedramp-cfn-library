AWSTemplateFormatVersion: '2010-09-09'
Description: 'FedRAMP Moderate Organization Boundary SCP Stack'

Parameters:
  TargetId:
    Type: String
    Default: ''
    Description: 'Optional OU or Account ID to attach the SCP'

  ApprovedRegions:
    Type: CommaDelimitedList
    Default: 'us-east-1,us-west-2'
    Description: >-
      Regions this SCP allows API calls in. Defaults assume a standard AWS
      commercial deployment — if deploying in AWS GovCloud, override with
      GovCloud region names (e.g. us-gov-west-1, us-gov-east-1) instead,
      since the two partitions don't share regions.

Conditions:
  HasTargetId: !Not [!Equals [!Ref TargetId, '']]

Resources:
  ModerateBoundarySCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: 'fedramp-moderate-authorization-boundary'
      Description: 'FedRAMP Moderate Authorization Boundary SCP'
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !If [HasTargetId, [!Ref TargetId], !Ref 'AWS::NoValue']
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDisablingSecurityServices
            Effect: Deny
            Action:
              - 'cloudtrail:DeleteTrail'
              - 'cloudtrail:StopLogging'
              - 'cloudtrail:UpdateTrail'
              - 'config:DeleteConfigRule'
              - 'config:DeleteConfigurationRecorder'
              - 'config:StopConfigurationRecorder'
              - 'guardduty:DeleteDetector'
              - 'securityhub:DeleteHub'
              - 'securityhub:DisableSecurityHub'
            Resource: '*'

          - Sid: DenyUnapprovedRegions
            Effect: Deny
            NotAction:
              - 'iam:*'
              - 'organizations:*'
              - 'route53:*'
              - 'cloudfront:*'
              - 'support:*'
            Resource: '*'
            Condition:
              StringNotEquals:
                'aws:RequestedRegion': !Ref ApprovedRegions

          - Sid: DenyInsecureTransport
            Effect: Deny
            Action:
              - 's3:*'
              - 'sqs:*'
              - 'dynamodb:*'
            Resource: '*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  PolicyId:
    Value: !Ref ModerateBoundarySCP
