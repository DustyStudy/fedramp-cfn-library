AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enforces S3 Public Access Block settings at the AWS account level (blocks
  public ACLs, public bucket policies, and cross-account access via public
  policy for every bucket in the account, including future ones).

  IMPLEMENTATION NOTE: account-level Public Access Block is set via the
  S3Control API's PutPublicAccessBlock action — there is no native
  CloudFormation resource type for it (only AWS::S3::Bucket's
  bucket-level PublicAccessBlockConfiguration exists as a CFN resource).
  This template uses a small Lambda-backed custom resource to make that
  call, which is the standard pattern for this gap.

  Control mapping:
    Rev5 (Moderate/High): AC-3, AC-6, SC-7
    FedRAMP 20x: KSI-CNBC-01 (configuration management), KSI-SVC-01 (service configuration hardening)

Resources:
  S3AccountPabDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: s3-account-pab-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  S3AccountPabLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SetAccountPublicAccessBlock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutAccountPublicAccessBlock
                  - s3:GetAccountPublicAccessBlock
                # Account-level Public Access Block is scoped by AccountId
                # in the request body, not by IAM resource ARN — this
                # action doesn't support resource-level permissions.
                Resource: '*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt S3AccountPabDLQ.Arn

  S3AccountPabFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_117"
            comment: >-
              This function only calls the S3Control API (control plane)
              and CloudFormation's callback URL — no VPC-resident
              resources are touched. Placing it in a VPC would require a
              NAT gateway or VPC endpoints purely to reach public AWS API
              endpoints, adding cost and failure modes with no security
              benefit.
    Properties:
      FunctionName: s3-account-public-access-block-custom-resource
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      ReservedConcurrentExecutions: 1
      DeadLetterConfig:
        TargetArn: !GetAtt S3AccountPabDLQ.Arn
      Role: !GetAtt S3AccountPabLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request


          def send_response(event, context, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': 's3-account-public-access-block',
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', str(len(body)))
              urllib.request.urlopen(req)


          def handler(event, context):
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      client = boto3.client('s3control')
                      sts = boto3.client('sts')
                      account_id = sts.get_caller_identity()['Account']
                      client.put_public_access_block(
                          AccountId=account_id,
                          PublicAccessBlockConfiguration={
                              'BlockPublicAcls': True,
                              'IgnorePublicAcls': True,
                              'BlockPublicPolicy': True,
                              'RestrictPublicBuckets': True
                          }
                      )
                  # On stack deletion, intentionally leave the account-level
                  # block in place rather than reverting it — silently
                  # re-opening every bucket in the account to public access
                  # just because someone deleted this stack is the wrong
                  # default for a security baseline.
                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  send_response(event, context, 'FAILED', reason=str(e))

  S3AccountPublicAccessBlock:
    Type: Custom::S3AccountPublicAccessBlock
    Properties:
      ServiceToken: !GetAtt S3AccountPabFunction.Arn

Outputs:
  S3AccountPabFunctionArn:
    Description: ARN of the custom resource Lambda that sets the account-level S3 Public Access Block
    Value: !GetAtt S3AccountPabFunction.Arn
