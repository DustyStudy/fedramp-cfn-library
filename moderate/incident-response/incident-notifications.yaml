AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Central incident-notification SNS topic that aggregates high-severity
  findings from GuardDuty and Security Hub into a single feed for incident
  response tooling (ticketing system, SOAR, on-call paging). Complements
  the per-service topics in modules/guardduty-org.yaml — deploy this
  alongside them if you want one aggregated feed rather than several
  separate ones.

  Control mapping:
    Rev5 (Moderate/High): IR-4, IR-5, IR-6
    FedRAMP 20x: KSI-MLA-RVL (alerting on findings; supports KSI-INR-* reviews)

Parameters:
  GuardDutySeverityThreshold:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 8.9
    Description: >
      Minimum GuardDuty finding severity to route here (7.0+ is High per
      GuardDuty's severity scale; 4.0-6.9 is Medium, 0.1-3.9 is Low).

Resources:
  # SNS topics encrypted with the AWS-managed key (alias/aws/sns) silently
  # drop messages from EventBridge: that key's policy can't be edited to allow
  # the service to use it. A customer-managed key whose policy trusts the
  # publishing service is required for the notification path to work.
  IncidentNotificationTopicKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for the security incident notification SNS topic'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  IncidentNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: security-incident-notifications
      KmsMasterKeyId: !GetAtt IncidentNotificationTopicKey.Arn

  IncidentNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref IncidentNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref IncidentNotificationTopic
            # Only this template's two rules may publish (confused-deputy guard).
            Condition:
              ArnEquals:
                'aws:SourceArn':
                  - !GetAtt GuardDutyHighSeverityRule.Arn
                  - !GetAtt SecurityHubCriticalHighRule.Arn

  GuardDutyHighSeverityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: incident-guardduty-high-severity
      Description: Routes GuardDuty findings at or above the configured severity threshold to the incident topic.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          severity:
            - numeric: ['>=', !Ref GuardDutySeverityThreshold]
      State: ENABLED
      Targets:
        - Arn: !Ref IncidentNotificationTopic
          Id: GuardDutyHighSeverityTarget

  SecurityHubCriticalHighRule:
    Type: AWS::Events::Rule
    Properties:
      Name: incident-securityhub-critical-high
      Description: Routes Security Hub findings with CRITICAL or HIGH label and an active workflow status to the incident topic.
      EventPattern:
        source:
          - aws.securityhub
        detail-type:
          - Security Hub Findings - Imported
        detail:
          findings:
            Severity:
              Label:
                - CRITICAL
                - HIGH
            Workflow:
              Status:
                - NEW
      State: ENABLED
      Targets:
        - Arn: !Ref IncidentNotificationTopic
          Id: SecurityHubCriticalHighTarget

Outputs:
  IncidentNotificationTopicArn:
    Description: >
      Central SNS topic for high-severity security findings — subscribe
      your ticketing system, SOAR pipeline, or on-call paging integration.
    Value: !Ref IncidentNotificationTopic
