name: Hardened FedRAMP CloudFormation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret & Credential Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-and-lint:
    name: CloudFormation Linter (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install CFN-Lint
        run: pip install cfn-lint

      - name: Run CFN-Lint on all CloudFormation Templates
        run: |
          cfn-lint $(find . -type f \( -name "*.yaml" -o -name "*.yml" \) ! -path "./.github/*")

  sast-security-scan:
    name: Multi-Engine SAST (Checkov & Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scan, syntax-and-lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Engine 1: Checkov CloudFormation FedRAMP / NIST Benchmark Scan (Blocking Hard Gate)
      - name: Run Checkov SAST
        uses: bridgecrewio/checkov-action@master
        with:
          framework: cloudformation
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      # Engine 2: Trivy CloudFormation Scanner (Reporting to Code Scanning tab)
      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-cfn-results.sarif'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-cfn-results.sarif') != ''
        with:
          sarif_file: 'trivy-cfn-results.sarif'
          category: 'trivy-cloudformation'
