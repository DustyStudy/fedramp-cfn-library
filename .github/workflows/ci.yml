name: Hardened FedRAMP CloudFormation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege by default; the one job that uploads SARIF raises
# security-events itself.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-and-lint:
    name: CloudFormation Linter (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install CFN-Lint
        run: pip install cfn-lint

      - name: Run CFN-Lint on all CloudFormation Templates
        run: |
          cfn-lint $(find . -type f \( -name "*.yaml" -o -name "*.yml" \) ! -path "./.github/*")

  sast-security-scan:
    name: Multi-Engine SAST (Checkov & Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [secret-scan, syntax-and-lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Engine 1: Checkov CloudFormation FedRAMP / NIST Benchmark Scan (Blocking Hard Gate)
      - name: Run Checkov SAST
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          framework: cloudformation
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      # Engine 2: Trivy CloudFormation Scanner (Reporting to Code Scanning tab)
      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-cfn-results.sarif'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() && hashFiles('trivy-cfn-results.sarif') != ''
        with:
          sarif_file: 'trivy-cfn-results.sarif'
          category: 'trivy-cloudformation'
